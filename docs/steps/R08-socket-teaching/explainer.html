<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Socket 區域 CAD 註冊</title><style>:root{color-scheme:light dark;font:16px system-ui}body{max-width:900px;margin:24px auto;padding:0 16px;line-height:1.7}canvas{width:100%;border:1px solid #888;border-radius:10px}button,input{font:inherit}button{padding:9px 14px;margin:5px}section{padding:15px;border:1px solid #888;border-radius:10px;margin:15px 0}</style>
<h1>選區辨識，再套共享 CAD</h1><p>此頁使用合成資料示意規則式 Socket 結構辨識，沒有執行實際辨識。R 只限定區域，無需樣本，沒有 NCC。</p>
<canvas id="board" width="840" height="300"></canvas>
<section><button id="region">R 註冊左側選區</button><button id="whole">F5 註冊全圖</button><button id="reset">重設</button><p id="status"></p></section>
<section><label>共享 CAD 寬度 <input type="range" id="size" min="24" max="50" value="38"><output id="value"></output></label><p>每個觀察只提供位置與左右結構類別；同類型共用尺寸與子檢測窗。</p></section>
<p>R 選區 → 直接產生 CAD → V 編輯／S 補框 → 儲存配方。這是 Socket 水平端點規則版，未知 PCB 類型須另訓練模型。</p>
<script type="application/json" id="aoi-data">{"ste":["Select a region.","Apply a shared CAD profile.","Review the boxes.","Save the recipe."]}</script>
<script>let extent=0;const $=s=>document.getElementById(s),ctx=$('board').getContext('2d');function draw(){ctx.fillStyle='#1c302d';ctx.fillRect(0,0,840,300);let found=0,w=+$('size').value;for(let i=0;i<24;i++){let x=45+(i%8)*103,y=45+Math.floor(i/8)*90;ctx.fillStyle='#ddd';ctx.fillRect(x-8,y-5,16,10);let left=i%2===0;ctx.fillRect(left?x-30:x+16,y-12,22,24);if(i%8<extent){ctx.strokeStyle='#64ff99';ctx.strokeRect(x-w/2,y-11,w,22);ctx.strokeStyle='#64ffff';ctx.strokeRect(x-w*.4,y-7,w*.8,14);found++}}if(extent===3){ctx.strokeStyle='#ffce40';ctx.strokeRect(4,5,310,280)}$('value').value=w+' px';$('status').textContent=extent?'示意產生 '+found+' 個固定規格 CAD；沒有建立樣本。':'按 R 註冊選區，或 F5 處理全圖。'}$('region').onclick=()=>{extent=3;draw()};$('whole').onclick=()=>{extent=8;draw()};$('reset').onclick=()=>{extent=0;draw()};$('size').oninput=draw;draw();</script></html>
