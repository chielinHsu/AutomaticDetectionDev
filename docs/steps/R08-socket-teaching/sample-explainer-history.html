<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Socket 教樣本 → 全圖搜尋</title><style>:root{color-scheme:light dark;font:16px system-ui}body{max-width:900px;margin:24px auto;padding:0 16px;line-height:1.7}canvas{width:100%;border:1px solid #888;border-radius:10px}button,input{font:inherit}button{padding:9px 14px;margin:5px}section{padding:15px;border:1px solid #888;border-radius:10px;margin:15px 0}</style>
<h1>教樣本，再搜尋整張 Socket</h1><p>此頁使用合成資料示意流程；實際比對請開啟 Qt 程式。沒有使用高度圖。</p>
<canvas id="board" width="840" height="300"></canvas>
<section><button id="teach">R 教一個樣本</button><button id="search">F5 搜尋整張圖</button><button id="reset">重設</button><p id="status"></p></section>
<section><label>相似度門檻 <input type="range" id="score" min="50" max="99" value="90"><output id="value"></output></label><p>變更後再按 F5。新產生的框全部使用第一個樣本的大小，仍需人工確認。</p></section>
<p>實際操作：R 連續教代表焊點 → F5 → V 修改／S 補框／Delete 刪除 → 儲存配方。JSON 保存樣本及門檻，原圖另存。</p>
<script type="application/json" id="aoi-data">{"ste":["Teach representative samples.","Search the whole image.","Review the boxes.","Save the recipe."]}</script>
<script>let samples=0,searched=false,cut=90;const ctx=document.querySelector('#board').getContext('2d');function draw(){ctx.fillStyle='#1c302d';ctx.fillRect(0,0,840,300);let found=0;for(let i=0;i<24;i++){let x=35+(i%8)*103,y=45+Math.floor(i/8)*90;ctx.fillStyle=i%5?'#d8dede':'#888f8e';ctx.fillRect(x,y,40,20);ctx.fillStyle='#1c302d';ctx.fillRect(x+24,y,16,8);if(samples&&i===0){ctx.strokeStyle='#4cbcff';ctx.lineWidth=3;ctx.strokeRect(x-4,y-4,48,28)}let sim=i%5?98-(i%4):75;if(samples&&searched&&sim>=cut){ctx.strokeStyle='#64ff99';ctx.lineWidth=2;ctx.strokeRect(x-4,y-4,48,28);found++}}document.querySelector('#value').value=cut+'%';document.querySelector('#status').textContent=!samples?'先按 R 教樣本。':!searched?'已有 '+samples+' 個樣本，按 F5 搜尋。':'示意找到 '+found+' 個固定 48×28 框；實際數量由影像與樣本決定。'}document.querySelector('#teach').onclick=()=>{samples=Math.min(16,samples+1);searched=false;draw()};document.querySelector('#search').onclick=()=>{if(samples)searched=true;draw()};document.querySelector('#reset').onclick=()=>{samples=0;searched=false;draw()};document.querySelector('#score').oninput=e=>{cut=+e.target.value;searched=false;draw()};draw();</script></html>
