<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S05 晶格估計與補漏</title>
<style>
:root{--bg:#f6f7f9;--panel:#fff;--ink:#18212b;--muted:#566273;--line:#d3d9e0;--accent:#1d4ed8;--accent-ink:#fff;
  --sample:#1d4ed8;--found:#15803d;--infer:#b45309;--reject:#b91c1c;--pred:#6b7787;--ok:#15803d;--bad:#b91c1c;--board:#eef3ec;--truth:#9aa8b8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f141a;--panel:#18202a;--ink:#e7edf4;--muted:#9aa8b8;--line:#2c3846;
  --accent:#7aa7ff;--accent-ink:#0b1220;--sample:#7aa7ff;--found:#4ade80;--infer:#fbbf24;--reject:#f87171;--pred:#8fa0b4;--ok:#4ade80;--bad:#f87171;--board:#16221b;--truth:#56657a}}
:root[data-theme="dark"]{--bg:#0f141a;--panel:#18202a;--ink:#e7edf4;--muted:#9aa8b8;--line:#2c3846;
  --accent:#7aa7ff;--accent-ink:#0b1220;--sample:#7aa7ff;--found:#4ade80;--infer:#fbbf24;--reject:#f87171;--pred:#8fa0b4;--ok:#4ade80;--bad:#f87171;--board:#16221b;--truth:#56657a}
*{box-sizing:border-box} html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,"Segoe UI","Microsoft JhengHei",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:14px}
h1{font-size:22px;margin:0 0 4px} h2{font-size:16px;margin:0 0 8px} h3{font-size:13px;letter-spacing:.04em;color:var(--accent);margin:12px 0 2px}
.zh{color:var(--muted);font-size:13.5px} .muted{color:var(--muted)} .small{font-size:12.5px}
.grid{display:grid;grid-template-columns:1.35fr 1fr;gap:14px} @media (max-width:860px){.grid{grid-template-columns:1fr}}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 16px;margin-top:10px;font-size:13.5px}
.controls label{display:flex;flex-direction:column;gap:2px}
.controls .row{display:flex;gap:8px;align-items:center}
input[type=range]{width:100%;accent-color:var(--accent)} output{min-width:3.5em;font-variant-numeric:tabular-nums}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:5px 10px;border-radius:8px;font:inherit;font-size:13px;cursor:pointer}
.btn[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btns{display:flex;flex-wrap:wrap;gap:6px}
svg.board{width:100%;height:auto;display:block;border-radius:10px;background:var(--board);border:1px solid var(--line)}
svg text{fill:var(--ink);font:12px system-ui,"Microsoft JhengHei",sans-serif}
.inl{fill:none;stroke:var(--found);stroke-width:2}
.out{fill:none;stroke:var(--reject);stroke-width:1.6;stroke-dasharray:1.5 3;stroke-linecap:round}
.hole{fill:none;stroke:var(--infer);stroke-width:2;stroke-dasharray:6 3}
.truth{fill:var(--truth)}
.lost{stroke:var(--truth);stroke-width:1.6}
.vec{stroke:var(--sample);stroke-width:2.2;marker-end:url(#arr)}
.metrics{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:13.5px;font-variant-numeric:tabular-nums}
.metrics span{color:var(--muted)} .metrics b{text-align:right;font-weight:600}
.status{font-weight:700;padding:6px 10px;border-radius:8px;margin-bottom:8px;border:1px solid var(--line)}
.status.ok{border-color:var(--ok);color:var(--ok)} .status.none{border-color:var(--bad);color:var(--bad)} .status.check{border-color:var(--infer);color:var(--infer)}
.meter{position:relative;height:14px;border-radius:7px;background:var(--line);margin:8px 0 18px}
.meter i{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:var(--accent)}
.meter em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.6}
.meter small{position:absolute;top:16px;transform:translateX(-50%);font-size:11px;color:var(--muted);white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;margin-top:8px;color:var(--muted)}
.legend svg{width:30px;height:16px;vertical-align:middle;margin-right:4px}
.note{border-left:4px solid var(--accent);padding:4px 10px;margin:10px 0;background:color-mix(in srgb,var(--accent) 8%,transparent);font-size:13.5px}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:right}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:500}
.barcell{width:42%} .bar{height:10px;border-radius:5px;background:var(--accent);min-width:2px}
@media (max-width:560px){.barcell{width:18%} th,td{padding:5px 4px}}
.bar.over{background:var(--bad)}
</style>
</head>
<body>
<div class="wrap">
  <h1>S05 晶格估計與補漏</h1>
  <p class="muted" id="lead"></p>

  <div class="grid">
    <div class="card">
      <h2>拖拉看看：雜訊、缺件、傾斜、離群點</h2>
      <svg class="board" id="board" viewBox="0 0 640 420" role="img" aria-label="合成陣列與 C++ 擬合出來的晶格">
        <defs><marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--sample)"/></marker></defs>
        <g id="layer"></g>
      </svg>
      <div class="controls">
        <label>位置雜訊 Noise（每軸 ±px；格距 30 × 40）<span class="row"><input type="range" id="noise" min="0" max="4" step="1" value="1"><output id="noiseOut"></output></span></label>
        <label>缺件 Missing<span class="row"><input type="range" id="missing" min="0" max="4" step="1" value="1"><output id="missingOut"></output></span></label>
        <label>陣列傾斜 Tilt<span class="row"><input type="range" id="tilt" min="0" max="2" step="1" value="1"><output id="tiltOut"></output></span></label>
        <label>離群點 Outliers<span class="row"><input type="range" id="outliers" min="0" max="1" step="1" value="0"><output id="outliersOut"></output></span></label>
      </div>
      <div class="legend" aria-label="圖例">
        <span><svg viewBox="0 0 30 16" aria-hidden="true"><rect class="inl" x="4" y="3" width="22" height="10"/></svg>內點（屬於晶格）</span>
        <span><svg viewBox="0 0 30 16" aria-hidden="true"><rect class="out" x="4" y="3" width="22" height="10"/></svg>不屬於晶格</span>
        <span><svg viewBox="0 0 30 16" aria-hidden="true"><rect class="hole" x="4" y="3" width="22" height="10"/></svg>推算的缺格（Inferred）</span>
        <span><svg viewBox="0 0 30 16" aria-hidden="true"><path class="lost" d="M11 4l8 8M19 4l-8 8"/></svg>真的缺件（只有示範頁知道）</span>
        <span><svg viewBox="0 0 30 16" aria-hidden="true"><line class="vec" x1="3" y1="8" x2="24" y2="8"/></svg>基底 u、v</span>
      </div>
    </div>
    <aside class="card" aria-live="polite">
      <div class="status" id="status"></div>
      <div class="meter" id="meter" aria-hidden="true"></div>
      <div class="metrics" id="metrics"></div>
      <div id="verdict"></div>
      <p class="small muted" id="provenance"></p>
    </aside>
  </div>

  <div class="card">
    <h2>特殊情況：退化、已知會失敗的情況與對策</h2>
    <div class="btns" id="specialButtons" role="group" aria-label="選一個情況"></div>
    <div class="grid" style="margin-top:10px">
      <svg class="board" id="board2" viewBox="0 0 640 420" role="img" aria-label="特殊情況與 C++ 的結果">
        <defs><marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--sample)"/></marker></defs>
        <g id="layer2"></g>
      </svg>
      <div aria-live="polite">
        <div class="status" id="status2"></div>
        <div class="metrics" id="metrics2"></div>
        <h3>這個情況</h3>
        <p lang="en" id="specialEn"></p>
        <p class="zh" lang="zh-Hant" id="specialZh"></p>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>速度（這台機器實測，Release）</h2>
    <table>
      <thead><tr><th>量什麼</th><th>中位數</th><th>p95</th><th class="barcell">相對大小（對數刻度）</th></tr></thead>
      <tbody id="speed"></tbody>
    </table>
    <p class="small muted" id="speedNote"></p>
  </div>

  <div class="card" id="text"></div>
</div>

<!-- 頁面的文字。key 叫 "ste" 的字串由 tools/ste-lint.mjs 檢查。 -->

(() => {
  const text = JSON.parse(document.getElementById('aoi-data').textContent);
  const data = JSON.parse(document.getElementById('lattice-data').textContent);
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const f1 = (n) => Number(n).toFixed(1), f2 = (n) => Number(n).toFixed(2), pct = (n) => Math.round(n * 100) + '%';
  $('#lead').textContent = text.lead.zh;
  if (!data.sweep) { $('#status').textContent = '這一頁還沒有 C++ 的資料。'; return; }

  // geometry.h 的角度慣例：螢幕上逆時針為正，y 向下。
  const rot = (x, y, deg) => { const r = deg * Math.PI / 180, c = Math.cos(r), s = Math.sin(r); return [x * c + y * s, -x * s + y * c]; };
  const PART = [24, 18];
  const box = (x, y, deg, cls, w = PART[0], h = PART[1]) =>
    `<rect class="${cls}" x="${f1(-w / 2)}" y="${f1(-h / 2)}" width="${w}" height="${h}" rx="2" transform="translate(${f1(x)} ${f1(y)}) rotate(${f1(-deg)})"/>`;
  const cross = (x, y) => `<path class="lost" d="M${f1(x - 5)} ${f1(y - 5)}l10 10M${f1(x + 5)} ${f1(y - 5)}l-10 10"/>`;

  function drawFit(points, fit, angle, marker) {
    const n = points.length / 2;
    const inlier = new Array(n).fill(false);
    let g = '';
    for (const m of fit.models) for (let k = 0; k < n; k++) if (m.inliers[k] === '1') inlier[k] = true;
    for (const m of fit.models) for (let k = 0; k < m.holes.length; k += 2) g += box(m.holes[k], m.holes[k + 1], angle, 'hole');
    for (let k = 0; k < n; k++) g += box(points[2 * k], points[2 * k + 1], angle, inlier[k] ? 'inl' : 'out');
    for (const m of fit.models) {
      const [ox, oy] = m.o;
      g += `<line class="vec" style="marker-end:url(#${marker})" x1="${f1(ox)}" y1="${f1(oy)}" x2="${f1(ox + m.u[0])}" y2="${f1(oy + m.u[1])}"/>`;
      if (m.hasV) g += `<line class="vec" style="marker-end:url(#${marker})" x1="${f1(ox)}" y1="${f1(oy)}" x2="${f1(ox + m.v[0])}" y2="${f1(oy + m.v[1])}"/>`;
    }
    return g;
  }

  function status(el, fit) {
    if (!fit.models.length) {
      el.className = 'status none';
      el.textContent = '沒有晶格：' + (text.reasons[fit.reason] || fit.reason) + '。只顯示找到的元件，不補漏。';
      return;
    }
    const m = fit.models[0];
    el.className = 'status ' + (m.check ? 'check' : 'ok');
    el.textContent = (fit.models.length > 1 ? fit.models.length + ' 組晶格，主晶格' : '找到晶格') + (m.hasV ? '（二維 ' : '（一維 ') +
      m.size[0] + (m.hasV ? ' × ' + m.size[1] : '') + ' 格）' + (m.check ? '——信心偏低，建議檢查' : '');
  }

  function metrics(el, fit, extra = []) {
    const rows = [];
    if (fit.models.length) {
      const m = fit.models[0];
      const holes = fit.models.reduce((s, x) => s + x.holes.length / 2, 0);
      rows.push(['內點', [...m.inliers].filter((c) => c === '1').length], ['推算的缺格（全部晶格）', holes],
        ['|u|、|v|', f1(Math.hypot(...m.u)) + (m.hasV ? '、' + f1(Math.hypot(...m.v)) : '') + ' px'],
        ['殘差 rms ／ 容差', f2(m.rms) + ' ／ ' + f2(m.tol) + ' px'], ['涵蓋率', pct(m.coverage)], ['一致性', pct(m.consistency)], ['信心', f2(m.confidence)]);
    } else if (fit.reason === 'lowConfidence') {
      rows.push(['被擋掉的信心', f2(fit.rejectedConfidence)]);
    }
    el.innerHTML = rows.concat(extra).map(([k, v]) => `<span>${esc(k)}</span><b>${esc(v)}</b>`).join('');
  }

  // ---- 掃描：四個滑桿選一組 C++ 的結果 ----
  const axes = data.axes, G = data.grid;
  const ctl = ['noise', 'missing', 'tilt', 'outliers'];
  const label = { noise: (v) => '±' + v + ' px', missing: (v) => pct(v), tilt: (v) => v + '°', outliers: (v) => v + ' 個' };
  function render() {
    const at = ctl.map((c) => +$('#' + c).value);
    ctl.forEach((c, k) => { $('#' + c + 'Out').textContent = label[c](axes[c][at[k]]); });
    const index = ((at[0] * axes.missing.length + at[1]) * axes.tilt.length + at[2]) * axes.outliers.length + at[3];
    const e = data.sweep[index], tilt = axes.tilt[at[2]];
    // 標準答案的格點（頁面只用來畫背景與真的缺件；結果全部來自 C++）。
    const [hx, hy] = rot((G.cols - 1) * G.pitchX / 2, (G.rows - 1) * G.pitchY / 2, tilt);
    const truth = (cell) => { const c = Math.floor(cell / G.rows), r = cell % G.rows; const [dx, dy] = rot(c * G.pitchX, r * G.pitchY, tilt); return [G.center[0] - hx + dx, G.center[1] - hy + dy]; };
    let g = '';
    for (let cell = 0; cell < G.cols * G.rows; cell++) { const [x, y] = truth(cell); g += `<circle class="truth" cx="${f1(x)}" cy="${f1(y)}" r="2"/>`; }
    for (const cell of e.missing) { const [x, y] = truth(cell); g += cross(x, y); }
    g += drawFit(e.pts, e.fit, tilt, 'arr');
    $('#layer').innerHTML = g;
    status($('#status'), e.fit);
    const ev = e.eval;
    metrics($('#metrics'), e.fit, ev ? [['指派錯的點（對照標準答案）', ev.wrong], ['假的缺格', ev.falseHoles], ['漏補的真缺件', ev.missed]] : []);
    const conf = e.fit.models.length ? e.fit.models[0].confidence : (e.fit.rejectedConfidence || 0);
    $('#meter').innerHTML = `<i style="width:${(conf * 100).toFixed(1)}%"></i><em style="left:15%"></em><small style="left:15%">0.15 沒有晶格</small><em style="left:60%"></em><small style="left:60%">0.6 建議檢查</small>`;
    const good = ev && ev.wrong === 0 && ev.falseHoles === 0 && ev.missed === 0;
    $('#verdict').innerHTML = e.fit.models.length
      ? `<p class="note">${good ? '和標準答案完全一致：每個點都在對的格子，補的缺格都是真的缺件。' : '和標準答案不一致（看上面三個數字）。範圍外的失敗要「安全」：沒有晶格，或信心低、建議檢查。'}</p>`
      : `<p class="note">這是安全的失敗：沒有補任何一格。</p>`;
  }
  ctl.forEach((c) => $('#' + c).addEventListener('input', render));
  $('#provenance').textContent = `資料：${data.generator}（${data.sweep.length} 組情境；陣列 ${G.cols} × ${G.rows}，格距 ${G.pitchX} × ${G.pitchY} px）。`;
  render();

  // ---- 特殊情況 ----
  const specials = data.specials;
  function showSpecial(id) {
    const s = specials.find((x) => x.id === id), t = text.specials[id];
    $('#layer2').innerHTML = drawFit(s.pts, s.fit, 0, 'arr2');
    status($('#status2'), s.fit);
    metrics($('#metrics2'), s.fit, [['輸入的點', s.pts.length / 2]]);
    $('#specialEn').textContent = t.ste.text;
    $('#specialZh').textContent = t.zh;
    document.querySelectorAll('#specialButtons .btn').forEach((b) => b.setAttribute('aria-pressed', b.dataset.id === id));
  }
  $('#specialButtons').innerHTML = specials.map((s) => `<button type="button" class="btn" data-id="${esc(s.id)}" aria-pressed="false">${esc(text.specials[s.id].label)}</button>`).join('');
  document.querySelectorAll('#specialButtons .btn').forEach((b) => b.addEventListener('click', () => showSpecial(b.dataset.id)));
  showSpecial(specials[0].id);

  // ---- 速度 ----
  const speed = text.speed;
  // median、p95 是 3 次執行的範圍（文字）；長條與超標用 p95Max（3 次中最大的 p95）。
  const lo = Math.log10(0.001), hi = Math.log10(Math.max(...speed.map((r) => r.p95Max), 1));
  $('#speed').innerHTML = speed.map((r) => {
    const w = Math.max(1, ((Math.log10(Math.max(r.p95Max, 0.001)) - lo) / (hi - lo)) * 100);
    return `<tr><td>${esc(r.label)}${r.budget ? `（預算 ${r.budget} ms）` : ''}</td><td>${esc(r.median)} ms</td><td>${esc(r.p95)} ms</td>` +
      `<td class="barcell"><div class="bar${r.budget && r.p95Max > r.budget ? ' over' : ''}" style="width:${w.toFixed(1)}%"></div></td></tr>`;
  }).join('');
  $('#speedNote').textContent = text.speedNote || '';

  // ---- 文字 ----
  $('#text').innerHTML = text.sections.map((s) => `<h3>${esc(s.title)}</h3><p lang="en">${esc(s.ste.text)}</p><p class="zh" lang="zh-Hant">${esc(s.zh)}</p>`).join('');
})();
</script>
</body>
</html>
