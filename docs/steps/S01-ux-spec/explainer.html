<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AOI UX 原型</title>
<style>
:root{
  --window:#F6F8FA; --panel:#FFFFFF; --canvas:#D8DEE4; --text:#1F2328; --muted:#59636E; --border:#D0D7DE;
  --accent:#0969DA; --onAccent:#FFFFFF; --focus:#0969DA;
  --fs:1;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{color-scheme:light dark;font-size:calc(15px * var(--fs))}
body{margin:0;background:var(--window);color:var(--text);font:1rem/1.5 system-ui,"Segoe UI","Microsoft JhengHei",sans-serif}
.wrap{max-width:1240px;margin:0 auto;padding:12px 16px 40px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:8px}
h1{font-size:1.4rem;margin:0}
h2{font-size:1.1rem;margin:0 0 6px}
.sub{margin:2px 0 0;color:var(--muted);font-size:.87rem}
.hdr{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;border-right:1px solid var(--border)}
.seg button:last-child{border-right:0}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:5px 11px;cursor:pointer;min-height:34px}
button:hover:not(:disabled){border-color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
button[aria-pressed="true"],button[aria-selected="true"]{background:var(--accent);color:var(--onAccent);border-color:var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible,.cvw:focus-visible,.row:focus-visible,textarea:focus-visible,.trow:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
select,input[type=number],input[type=text],textarea{background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:4px 6px;min-height:32px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px;min-width:0}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.zh-note{color:var(--muted);font-size:.85rem}
.intro{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:12px}
.intro h3{margin:0 0 2px;font-size:.78rem;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.intro p{margin:0 0 4px}
@media (max-width:900px){.intro{grid-template-columns:1fr}}

/* state strip */
.strip{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.pill{border:1px solid var(--border);background:var(--panel);border-radius:999px;padding:2px 12px;font-size:.85rem;display:inline-flex;gap:6px;align-items:center}
.pill[aria-current="true"]{background:var(--accent);color:var(--onAccent);border-color:var(--accent);font-weight:600}
.jump{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.jump button{min-height:28px;padding:1px 8px;font-size:.82rem}

/* app mock */
.app{border:1px solid var(--border);border-radius:10px;background:var(--window);overflow:hidden}
.tb{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 8px;background:var(--panel);border-bottom:1px solid var(--border)}
.tb .sp{flex:1}
.tb label{display:inline-flex;gap:6px;align-items:center;font-size:.88rem}
.mid{display:grid;grid-template-columns:48px minmax(0,1fr) 310px}
@media (max-width:900px){.mid{grid-template-columns:48px minmax(0,1fr)} .docks{grid-column:1 / -1;border-left:0 !important;border-top:1px solid var(--border)}}
@media (max-width:560px){.mid{grid-template-columns:1fr} .rail{flex-direction:row !important;border-right:0 !important;border-bottom:1px solid var(--border)}}
.rail{display:flex;flex-direction:column;gap:6px;padding:6px;background:var(--panel);border-right:1px solid var(--border)}
.rail button{width:36px;height:36px;padding:0;font-weight:700;position:relative}
.cvw{position:relative;height:min(62vh,540px);min-height:360px;background:var(--canvas);overflow:hidden;touch-action:none;outline-offset:-3px}
.cvw svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.cvw.gray svg,.cvw.gray .swatches{filter:grayscale(1)}
.cvw.pan{cursor:grab}.cvw.panning{cursor:grabbing}.cvw.busy{cursor:progress}.cvw.sampling{cursor:crosshair}.cvw.adding{cursor:copy}
.cvw.dis{cursor:default}
.float{position:absolute;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:12px 14px;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:min(460px,calc(100% - 24px))}
.float h3{margin:0 0 4px;font-size:1.02rem}
.float p{margin:0 0 6px}
.float ul{margin:0 0 8px;padding-left:1.1em}
.float .acts{display:flex;gap:8px;flex-wrap:wrap}
#msgEmpty{left:50%;top:50%;transform:translate(-50%,-50%);text-align:center}
.cvcol{display:flex;flex-direction:column;min-width:0}
/* Messages never cover the image: they live in a bar under the canvas. */
#msgBar{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:6px 10px;min-height:2.5rem;background:var(--panel);border-top:1px solid var(--border)}
#hintbar{font-size:.85rem;color:var(--muted)}
#previewBar{display:flex;gap:8px;flex-wrap:wrap}
#progress{display:flex;gap:10px;align-items:center;flex:1 1 320px;min-width:0}
#progress .bar{flex:1;height:8px;border-radius:4px;background:var(--border);overflow:hidden}
#progress .bar i{display:block;height:100%;background:var(--accent);width:0}
.barcard{flex:1 1 100%;min-width:0}
.barcard h3{margin:0 0 2px;font-size:.95rem}
.barcard p{margin:0 0 2px}
.barcard ul{margin:0 0 6px;padding-left:1.1em}
.barcard .acts{display:flex;gap:8px;flex-wrap:wrap}
#msgError{border-left:6px solid var(--rej);padding-left:10px}
#toast{margin-left:auto;background:var(--text);color:var(--window);border-radius:8px;padding:2px 12px;font-size:.85rem;max-width:100%}
.docks{border-left:1px solid var(--border);background:var(--panel);display:flex;flex-direction:column;min-width:0;max-height:min(62vh,540px);overflow:auto}
@media (max-width:900px){.docks{max-height:none}}
.dock{padding:8px 10px;border-bottom:1px solid var(--border)}
.dock h2{font-size:.82rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.chip{min-height:26px;padding:0 9px;font-size:.8rem;border-radius:999px;display:inline-flex;align-items:center;gap:5px}
.chip svg{width:22px;height:8px}
.tree{max-height:230px;overflow:auto;border:1px solid var(--border);border-radius:8px;font-size:.84rem}
.trow{display:grid;grid-template-columns:18px 30px minmax(0,1fr) auto;gap:4px;align-items:center;width:100%;text-align:left;border:0;border-bottom:1px solid var(--border);border-radius:0;min-height:26px;padding:1px 6px;background:var(--panel);cursor:pointer}
.trow.root{grid-template-columns:minmax(0,1fr) auto;font-weight:600;cursor:default}
.trow.child{padding-left:30px;grid-template-columns:30px minmax(0,1fr) auto;min-height:24px;font-size:.8rem}
.trow:last-child{border-bottom:0}
.trow[aria-selected="true"]{background:var(--accent);color:var(--onAccent)}
.trow svg{width:28px;height:10px}
.trow .sc{font-variant-numeric:tabular-nums}
.trow small{opacity:.7}
.tw{border:0;background:none;padding:0;min-height:22px;width:18px;color:inherit}
.lib{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid var(--border)}
.lib:last-child{border-bottom:0}
.lib svg.th{width:64px;height:40px;background:var(--canvas);border-radius:4px}
.lib b{font-variant-numeric:tabular-nums}
.lib .b2{display:flex;flex-direction:column;gap:4px}
.lib button{min-height:26px;padding:0 8px;font-size:.8rem}
.slider{display:flex;gap:8px;align-items:center}
.slider input[type=range]{flex:1;min-width:0}
.sb{display:flex;gap:14px;flex-wrap:wrap;align-items:center;padding:4px 10px;background:var(--panel);border-top:1px solid var(--border);font-size:.84rem;min-height:30px}
.sb .grow{flex:1}
.sb .mono{font-variant-numeric:tabular-nums}
.spin{display:inline-block;width:.8em;height:.8em;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-1px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.field{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0}
.field label{min-width:7.5em}
.ed .field label{min-width:6.2em;font-size:.85rem}
.ed input[type=number]{width:4.8em}
.ed input[type=text]{width:9em}
.ed .pair{display:flex;gap:4px;align-items:center}
#edGroups{max-height:140px}
.fail{color:var(--rej);font-weight:700}.pass{color:var(--fnd);font-weight:700}

.cols2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-top:12px}
@media (max-width:860px){.cols2{grid-template-columns:1fr}}
#log{max-height:210px;overflow:auto;font:.78rem/1.45 Consolas,monospace;margin:0;padding:0;list-style:none}
#log li{border-bottom:1px dotted var(--border);padding:1px 0}
#log .ev{color:var(--accent)} #log .cmd{color:var(--fnd)} #log .ign{color:var(--muted)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{border-bottom:1px solid var(--border);padding:5px 6px;text-align:left;vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.05em}
kbd{font:.8rem Consolas,monospace;border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--window);white-space:nowrap}
.mono{font-variant-numeric:tabular-nums}
td.pass,td.fail{font-weight:600}
.lab{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:860px){.lab{grid-template-columns:1fr}}
.swatches{display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:8px}
.swatches .sw{display:flex;align-items:center;gap:10px}
.swatches svg{width:120px;height:26px;flex:none}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div>
    <h1 data-zh="S01 · UX 原型" data-en="S01 · UX prototype"></h1>
    <p class="sub" data-zh="可點擊原型：教樣本、用樣本庫掃描區域、編輯元件類型（Board › Component › Box）。這不是 Qt 程式，只驗證版面、狀態語言與互動規則。" data-en="A clickable prototype: teach a sample, scan a region with the library, edit a component type (Board › Component › Box). It is not Qt code. It checks the layout, the state language and the rules."></p>
  </div>
  <div class="hdr">
    <button id="lang" aria-label="language">EN</button>
    <div class="seg" role="group" aria-label="theme">
      <button data-theme-set="system" data-i18n="ui.settings.theme.system"></button>
      <button data-theme-set="light" data-i18n="ui.settings.theme.light"></button>
      <button data-theme-set="dark" data-i18n="ui.settings.theme.dark"></button>
    </div>
    <div class="seg" role="group" aria-label="font scale"><span class="small muted" style="padding:6px 8px" data-i18n="ui.settings.fontScale"></span>
      <button data-fs="1">100%</button><button data-fs="1.25">125%</button><button data-fs="1.5">150%</button>
    </div>
  </div>
</header>

<nav class="tabs" role="tablist">
  <button role="tab" id="tab1" aria-controls="p1" aria-selected="true" data-zh="1 · 互動原型" data-en="1 · Prototype"></button>
  <button role="tab" id="tab2" aria-controls="p2" aria-selected="false" data-zh="2 · 狀態語言實驗室" data-en="2 · State language lab"></button>
  <button role="tab" id="tab3" aria-controls="p3" aria-selected="false" data-zh="3 · 規則與快捷鍵" data-en="3 · Rules and keys"></button>
</nav>

<!-- ============ TAB 1 ============ -->
<section id="p1" role="tabpanel" aria-labelledby="tab1">
  <div class="intro card" id="intro"></div>

  <div class="strip" id="strip" aria-label="state">
    <div class="jump" id="jump"></div>
  </div>

  <div class="app" id="app">
    <div class="tb">
      <button id="bOpen"></button>
      <button id="bSave" disabled></button>
      <label><span data-i18n="ui.backend.label"></span>
        <select id="backend"><option value="OpenCV">OpenCV</option><option value="HALCON">HALCON</option></select></label>
      <span class="sp"></span>
      <button id="bUndo"></button>
      <button id="bRedo"></button>
      <button id="bFit"></button>
      <button id="bExport"></button>
    </div>
    <div class="mid">
      <div class="rail" id="rail" role="toolbar" aria-label="tools">
        <button data-tool="select" aria-pressed="true">V</button>
        <button data-tool="sample" aria-pressed="false">S</button>
        <button data-tool="scan" aria-pressed="false">R</button>
        <button data-tool="add" aria-pressed="false">+</button>
      </div>
      <div class="rail" id="railEd" role="toolbar" aria-label="editor tools" hidden>
        <button data-edtool="select" aria-pressed="true">V</button>
        <button data-edtool="box" aria-pressed="false">B</button>
      </div>
      <div class="cvcol">
        <div class="cvw" id="cvw" tabindex="0" role="application" aria-label="Image canvas">
          <svg id="cv" xmlns="http://www.w3.org/2000/svg"><g id="board"></g><g id="ov"></g></svg>
          <div class="float" id="msgEmpty"></div>
        </div>
        <div id="msgBar">
          <div id="previewBar" hidden><button id="pbAccept" aria-pressed="true"></button><button id="pbAcceptSave"></button><button id="pbDiscard"></button></div>
          <div id="hintbar"></div>
          <div id="progress" role="status"><span id="progText"></span><span class="bar"><i id="progBar"></i></span><button id="progCancel"></button></div>
          <div class="barcard" id="msgNoMatch" role="status"></div>
          <div class="barcard" id="msgError" role="alert"></div>
          <div id="toast" role="status" hidden></div>
        </div>
      </div>
      <aside class="docks" id="docks">
        <div id="boardDocks">
          <div class="dock">
            <h2 id="libTitle"></h2>
            <input id="libFilter" type="text" placeholder="🔍" aria-label="library filter" style="width:100%;margin-bottom:4px">
            <div id="libList"></div>
          </div>
          <div class="dock">
            <h2 id="objTitle"></h2>
            <div class="chips" id="chips"></div>
            <div id="tree" class="tree" role="tree" aria-label="objects"></div>
            <div id="selInfo" class="small" style="margin-top:6px"></div>
            <div id="previewActions" style="margin-top:6px"></div>
          </div>
          <div class="dock">
            <h2 data-i18n="ui.params.title"></h2>
            <div class="field" style="margin-top:0"><label for="scanScope" data-i18n="ui.params.scanScope" style="min-width:0"></label><select id="scanScope" style="max-width:100%"><option value="auto" data-i18n="ui.params.scope.auto"></option><option value="board" data-i18n="ui.params.scope.board"></option><option value="all" data-i18n="ui.params.scope.all"></option></select></div>
            <div class="slider"><span class="small" data-i18n="ui.params.score"></span><input id="thr" type="range" min="0.30" max="0.99" step="0.01" value="0.70"><b class="mono" id="thrVal">0.70</b></div>
            <details style="margin-top:6px"><summary data-i18n="ui.params.advanced"></summary>
              <div class="field"><label for="angle" data-i18n="ui.params.angle"></label>
                <select id="angle"><option value="0">0°</option><option value="5">±5°</option><option value="180">±180°</option></select></div>
            </details>
            <p class="small muted" id="confHint" style="margin:6px 0 0"></p>
          </div>
        </div>
        <div id="editorPanel" class="ed" hidden>
          <div class="dock">
            <h2 data-i18n="ui.editor.title"></h2>
            <div class="field"><label for="edPart" data-i18n="ui.editor.partNo"></label><input id="edPart" type="text" maxlength="16" autocomplete="off"></div>
            <div class="field"><label for="edName" data-i18n="ui.editor.name"></label><input id="edName" type="text" maxlength="40" autocomplete="off"></div>
            <div class="field"><label for="edAlias" data-i18n="ui.editor.aliases"></label><input id="edAlias" type="text" maxlength="60" autocomplete="off" placeholder="R0603, 0603"></div>
            <div class="field"><label for="edCat" data-i18n="ui.editor.category"></label>
              <select id="edCat"><option value="Chip">Chip</option><option value="IC">IC</option><option value="Other">Other</option></select></div>
            <p class="small muted" id="edAffects" style="margin:0"></p>
            <p class="small fail" id="edError" role="alert" style="margin:4px 0 0"></p>
          </div>
          <div class="dock">
            <h2 data-i18n="ui.editor.groups"></h2>
            <div id="edGroups" class="tree"></div>
            <div class="field"><button id="edAddWin" data-i18n="ui.editor.addWindow"></button><button id="edAddAll" data-i18n="ui.editor.addAll"></button></div>
          </div>
          <div class="dock" id="edForm">
            <div class="field"><label data-i18n="ui.editor.kind"></label><b id="fKind"></b><span class="small muted" id="fParent"></span></div>
            <div class="field" data-for="Window"><label for="fAlgo" data-i18n="ui.editor.algo"></label>
              <select id="fAlgo"><option value="Void">Void</option><option value="Solder">Solder</option><option value="Color">Color</option></select></div>
            <div class="field" data-for="Body Pin"><label data-i18n="ui.editor.pos"></label><span class="pair"><input id="fX" type="number" step="1" aria-label="x"><input id="fY" type="number" step="1" aria-label="y"></span></div>
            <div class="field" data-for="Body Pin"><label data-i18n="ui.editor.size"></label><span class="pair"><input id="fW" type="number" min="1" step="1" aria-label="width"><span>×</span><input id="fH" type="number" min="1" step="1" aria-label="height"></span></div>
            <div class="field" data-for="Pin"><label for="fRows" data-i18n="ui.editor.rows"></label><input id="fRows" type="number" min="1" max="60" step="1">
              <label for="fCols" style="min-width:0" data-i18n="ui.editor.cols"></label><input id="fCols" type="number" min="1" max="60" step="1"></div>
            <div class="field" data-for="Pin"><label for="fPx" data-i18n="ui.editor.pitchX"></label><input id="fPx" type="number" step="1">
              <label for="fPy" style="min-width:0" data-i18n="ui.editor.pitchY"></label><input id="fPy" type="number" step="1"></div>
            <div class="field" data-for="Window"><label data-i18n="ui.editor.offset"></label><span class="pair"><input id="fOx" type="number" step="5" aria-label="offset x %"><input id="fOy" type="number" step="5" aria-label="offset y %"></span><span class="small muted">%</span></div>
            <div class="field" data-for="Window"><label data-i18n="ui.editor.ratio"></label><span class="pair"><input id="fRw" type="number" min="5" step="5" aria-label="width %"><span>×</span><input id="fRh" type="number" min="5" step="5" aria-label="height %"></span><span class="small muted">%</span></div>
            <div class="field"><label for="fScope" data-i18n="ui.editor.scopeLabel"></label>
              <select id="fScope"><option value="group" data-i18n="ui.editor.scope.group"></option><option value="kind" data-i18n="ui.editor.scope.kind"></option></select></div>
            <div class="field"><button id="fDelete"></button></div>
            <p class="small muted" id="edSelHint" style="margin:0"></p>
          </div>
          <div class="dock">
            <div class="field"><button id="edSaveLib"></button><button id="edSave" aria-pressed="true"></button><button id="edCancel" data-i18n="ui.editor.cancel"></button></div>
          </div>
        </div>
      </aside>
    </div>
    <div class="sb" role="status">
      <span id="sbBusy" hidden><span class="spin"></span><span id="sbBusyText"></span></span>
      <span class="mono" id="sbSummary"></span>
      <span class="grow"></span>
      <span class="mono muted" id="sbCursor"></span>
      <span class="mono" id="sbZoom"></span>
    </div>
  </div>

  <div class="cols2">
    <div class="card">
      <h2 data-zh="情境開關（只有原型有）" data-en="Scenario switches (prototype only)"></h2>
      <div class="field"><label for="simMs" data-zh="模擬搜尋耗時" data-en="Simulated search time"></label>
        <input id="simMs" type="range" min="50" max="6000" step="50" value="600" style="flex:1;min-width:120px"><b class="mono" id="simMsVal">600 ms</b></div>
      <div class="field"><label data-zh="模擬失敗" data-en="Simulate"></label>
        <label><input type="checkbox" id="optFail"> <span data-zh="搜尋失敗" data-en="search failure"></span></label>
        <label><input type="checkbox" id="optLowC"> <span data-zh="低對比元件" data-en="low contrast parts"></span></label>
        <label><input type="checkbox" id="optNoLic"> <span data-zh="HALCON 無授權" data-en="no HALCON license"></span></label></div>
      <div class="field"><label for="boardColor" data-zh="板子顏色" data-en="Board color"></label>
        <select id="boardColor"><option value="green">green</option><option value="blue">blue</option><option value="black">black</option></select>
        <label for="ovPal" data-zh="疊圖配色" data-en="Overlay colors"></label>
        <select id="ovPal"><option value="fixed" data-zh="固定亮色（建議）" data-en="fixed bright (proposed)"></option><option value="theme" data-zh="跟隨主題" data-en="follow theme"></option></select>
        <label><input type="checkbox" id="optGray"> <span data-zh="灰階（色盲檢查）" data-en="gray scale (color-blind check)"></span></label>

/* ----- search job (latest wins) ----- */
function cancelJob() { if (S.job) { clearInterval(S.job.tick); clearTimeout(S.job.done); S.job.cancelled = true; } S.job = null; S.progShown = false; }
function startSearch(rect, mode, opts = {}) {
  cancelJob();

  const libN = mode === 'scan' ? Math.max(1, scanPlan(rect).compared) : 1;
  const total = opts.totalMs ?? Math.round(Number($('#simMs').value) * mult * (mode === 'scan' ? 0.6 + 0.2 * libN : 1) * (0.95 + Math.random() * 0.1));
  const job = { start: performance.now(), total, pct: 0, cancelled: false, rect, mode };
  S.job = job; S.busyShownAt = 0; S.progShown = false; S.draftRect = rect; S.draftMode = mode; S.lastSearch = { rect, mode };
  if (S.backend === 'HALCON' && $('#optNoLic').checked) job.done = setTimeout(() => failSearch(job, { titleKey: 'ui.error.backend.title', bodyKey: 'ui.error.backend.body', args: { backend: 'HALCON', fallback: 'OpenCV' }, fallback: 'OpenCV', retry: false }), 30);
  else if ($('#optFail').checked) job.done = setTimeout(() => failSearch(job, { titleKey: 'ui.error.searchFailed.title', bodyKey: 'ui.error.searchFailed.body', args: { detail: 'E_BACKEND_TIMEOUT (simulated)' }, retry: true }), Math.max(60, total * 0.4));
  else job.done = setTimeout(() => finishSearch(job), total);
  job.tick = setInterval(() => {
    if (S.job !== job) return;
    const el = performance.now() - job.start;
    job.pct = Math.min(0.99, el / job.total);
    if (!S.busyShownAt && el >= TOK.timing.busyAfter) { S.busyShownAt = performance.now(); log(`busy sign shown at ${Math.round(el)} ms (rule: > ${TOK.timing.busyAfter} ms)`, 'ev'); }

    render();
  }, 50);

}
function endBusy() {

}

}
function finishSearch(job) {

  cancelJob();

  const res = job.mode === 'teach' ? searchTeach(job.rect, opts) : searchScan(job.rect, opts);
  const prop = { mode: job.mode, region: job.rect, insts: res.insts, reasons: [...res.reasons], args: res.args || {}, tempType: res.tempType || null, unrecognized: res.unrecognized || 0, outOfScope: res.outOfScope || 0, ms: job.total, backend: S.backend };

/* ----- accept / discard / undo ----- */
function snapshot() { return { prop: S.prop, region: S.region, session: S.session, thr: S.thr }; }
function restoreSnapshot(sn) { S.prop = sn.prop; S.region = sn.region; S.session = sn.session; S.thr = sn.thr; S.sel.clear(); S.selGroup = null; }
function accept() {
  if (S.state !== 'Preview') return null;
  S.session.dropRedo();
  const sn = snapshot();
  const tmp = S.prop.tempType;
  const nameSeqBefore = clone(S.nameSeq);
  const libSnap = {};
  const comps = propView().filter((v) => v.state !== 'rejected').map((v) => {
    const c = { id: v.inst.id, typeId: v.inst.typeId, cx: v.inst.cx, cy: v.inst.cy, rot: v.inst.rot, fixedState: v.state, score: v.inst.score, origin: v.inst.origin, kind: 'doc' };
    const ty = typeOf(c.typeId);
    c.name = assignName(LOOK[ty ? ty.look : 'A'].prefix);
    if (S.lib[c.typeId]) { libSnap[c.typeId] = clone(S.lib[c.typeId]); c.typeId = 'p_' + c.typeId; } // the board keeps its OWN copy of every library type it uses
    return c;
  });
  const created = [];
  const doRedo = () => {
    for (const [lid, snap] of Object.entries(libSnap)) { const pid = 'p_' + lid; if (!S.types[pid]) { S.types[pid] = { ...clone(snap), id: pid, libId: lid }; created.push(pid); } }

  doRedo();

  S.docStack.push(cmd); log(`command: ${cmd.label()}`, 'cmd');

}

  const ctrl = e.ctrlKey || e.metaKey;
  if (ctrl && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (ctrl && k === 'y') { e.preventDefault(); redo(); return; }
  if (ctrl || e.altKey) return;

  if (e.key === ' ' && e.target === cvw) { e.preventDefault(); if (!S.space) { S.space = true; render(); } return; }
  if (onBtn && (e.key === 'Enter' || e.key === ' ')) return;
  if (e.key === 'Escape') { e.preventDefault(); esc_(); return; }
  if (S.scene === 'type' && S.edit) {
    if (e.key === 'Delete' || e.key === 'Backspace') { if (S.edit.sel) { e.preventDefault(); edDeleteSel(); } return; }

  if (S.state === 'Empty') return;
  if (k === 'f') { fit(); render(); }
  else if (k === 'v') setTool('select'); else if (k === 's') setTool('sample'); else if (k === 'r') setTool('scan'); else if (k === 'a') setTool('add');

function esc_() { // Esc goes back one level

    if (S.edit.sel) { S.edit.sel = null; edSyncForm(); render(); return; }
    if (S.edit.tool === 'box') { S.edit.tool = 'select'; render(); return; }

  $('#labPrev').innerHTML = NAMES.map((n) => {
    const a = lineAttrs(n, false, 'Body');
    return `<div class="sw"><svg viewBox="0 0 120 26"><rect x="4" y="3" width="112" height="20" fill="none" stroke="${casingOn(n)}" stroke-width="${a.w + ST.casingExtraWidth}"${a.dash} stroke-linecap="${a.cap}"/><rect x="4" y="3" width="112" height="20" fill="none" stroke="${colorOn(n)}" stroke-width="${a.w}"${a.dash} stroke-linecap="${a.cap}"/></svg><span style="color:#fff;text-shadow:0 0 3px #000"><b>${esc(t('state.' + n))}</b> · ${ST[n].lineStyle} · ${ST[n].width}px</span></div>`;
  }).join('');
  const rows = [];
  const cell = (r) => `<td class="mono ${r >= 3 ? 'pass' : 'fail'}">${r.toFixed(2)} ${r >= 3 ? '✓' : '✗'}</td>`;
  for (const n of NAMES) rows.push(`<tr><td>${esc(t('state.' + n))}</td>${cell(ratio(colorFor(n), th.surface.panel))}${cell(ratio(colorOn(n), TOK.overlay.board.green))}${cell(ratio(colorOn(n), TOK.overlay.board.blue))}${cell(ratio(colorOn(n), TOK.overlay.board.black))}${cell(ratio(colorOn(n), casingOn(n)))}</tr>`);
  $('#labTable').innerHTML = `<tr><th>${T('狀態', 'State')}</th><th>${T('對面板', 'vs panel')}</th><th>${T('對綠板', 'vs green')}</th><th>${T('對藍板', 'vs blue')}</th><th>${T('對黑板', 'vs black')}</th><th>${T('對外框', 'vs casing')}</th></tr>` + rows.join('');
  const distinct = new Set(NAMES.map((n) => `${ST[n].lineStyle}|${ST[n].dash.join(',')}|${ST[n].width}`)).size === 4;
  $('#labTable').insertAdjacentHTML('beforeend', `<tr><td colspan="6" class="${distinct ? 'pass' : 'fail'}">${distinct ? T('✓ 四種線型互不相同（不只靠顏色）', '✓ The four line styles differ (not color alone)') : T('✗ 有兩個狀態的線型相同', '✗ Two states share one line style')}</td></tr>`);
}

/* ================= test hook (used by the S01 verification) ================= */
window.__proto = { S, FSM, go, jump, accept, discard, undo, redo, setThreshold, fit, render, ratio, TOK, openEditor, saveEditor, cancelEditor, expandGroups, instBoxes, searchScan, searchTeach, cadText, edApply, edAddAll, edAddWindow, edDeleteSel, edCommit, editorBoxes, savedTypes, PARTS, scanPlan, pullFromLib, pushToLibrary, typeOf, typeSame };

applyTheme();
applyI18n();
$$('[data-fs]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.fs === '1'));
render();
})();
