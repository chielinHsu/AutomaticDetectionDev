<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>步驟名稱</title>
<style>
/* Keep the same tokens in every explainer page so all pages look the same. */
:root{--bg:#f6f7f9;--panel:#fff;--ink:#18212b;--muted:#566273;--line:#d3d9e0;--accent:#1d4ed8;--accent-ink:#fff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f141a;--panel:#18202a;--ink:#e7edf4;--muted:#9aa8b8;--line:#2c3846;
  --accent:#7aa7ff;--accent-ink:#0b1220}}
:root[data-theme="dark"]{--bg:#0f141a;--panel:#18202a;--ink:#e7edf4;--muted:#9aa8b8;--line:#2c3846;
  --accent:#7aa7ff;--accent-ink:#0b1220}
*{box-sizing:border-box} html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,"Segoe UI","Microsoft JhengHei",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
h1{font-size:22px;margin:0 0 12px} h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:12px 0 2px}
.zh{color:var(--muted);font-size:13.5px}
</style>
</head>
<body>
<div class="wrap">
  <h1>步驟名稱</h1>
  <div class="card" id="stage"><!-- TODO: put the interactive part here (slider, stepper, toggle, live demo). --></div>
  <div class="card" id="text" style="margin-top:14px"></div>
</div>

<!-- Text for the page. Strings under the key "ste" are checked by tools/ste-lint.mjs. -->
<script type="application/json" id="ste-data">
{
  "sections": [
    { "title": "Purpose",
      "ste": { "text": "TODO: write two short sentences." },
      "zh": "TODO：繁中摘要" }
  ]
}
</script>
<script>
(() => {
  const data = JSON.parse(document.getElementById('ste-data').textContent);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  document.getElementById('text').innerHTML = data.sections
    .map((s) => `<h3>${esc(s.title)}</h3><p lang="en">${esc(s.ste.text)}</p><p class="zh" lang="zh-Hant">${esc(s.zh)}</p>`).join('');
})();
</script>
</body>
</html>
