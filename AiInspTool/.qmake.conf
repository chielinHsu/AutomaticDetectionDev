# qmake 從 .pro 所在的資料夾往上找到這個檔，所以 AiInspTool/ 底下的每個 .pro 都讀得到這三個變數。
# 所有 .pro 與 .pri 都放在 AiInspTool/ 底下（對照 src/、tests/ 的結構），原始碼用 $$AOI_ROOT/src/... 引用。
# 理由：子專案寫成 ../src/x.pro 時，qmake 依相對路徑決定它的建置資料夾，輸出會跑到建置資料夾外面（ADR-018）。

# repo 的根目錄（src/、tests/、docs/、tools/）
AOI_ROOT = $$clean_path($$PWD/..)
# 共用的 .pri（選項、旗標、依賴表、外部函式庫）
AOI_QMAKE = $$PWD/qmake
# 建置的根目錄：Qt Creator 的建置資料夾（原地建置時就是 AiInspTool/ 本身）
AOI_BUILD_ROOT = $$shadowed($$PWD)
